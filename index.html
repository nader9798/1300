<html>
    <head>
        <meta charset='utf-8'>
        <title>Mohamed Gaber PS4 11.02</title>
        <style>
            /* إعدادات الخلفية وضبط الأبعاد للشاشات الكبيرة والصغيرة */
            body {
                background-image: url('ps4.png'); /* ملف الصورة بتاعتك */
                background-size: 100% 100%;         /* ملء الشاشة بالكامل دون تمطيط */
                background-position: center;     /* سنتر الصورة في منتصف الشاشة دائمًا */
                background-repeat: no-repeat;    /* منع تكرار الصورة نهائيًا */
                background-attachment: fixed;    /* تثبيت الخلفية لشكل احترافي مستقر */
                color: #ffffff;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                text-align: center;
                margin: 0;
                padding: 0;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                height: 100vh;
            }

            /* حاوية المحتوى الشفافة الفخمة */
            .main-container {
                background: rgba(0, 0, 0, 0.65); /* طبقة داكنة خفيفة لإبراز الكلام والخلفية معًا */
                padding: 30px;
                border-radius: 20px;
                box-shadow: 0 0 30px rgba(0, 212, 255, 0.2);
                border: 1px solid rgba(0, 212, 255, 0.3);
                width: 85%;
                max-width: 550px;
                box-sizing: border-box;
            }

            /* تنسيق العداد الدائري النيوني الجذاب */
            .neon-timer {
                width: 120px;
                height: 120px;
                border: 5px solid #00d4ff;
                border-radius: 50%;
                display: flex;
                justify-content: center;
                align-items: center;
                color: #00d4ff;
                font-size: 45px;
                font-weight: bold;
                text-shadow: 0 0 10px #00d4ff, 0 0 20px #00d4ff;
                margin: 20px auto;
                box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
                background: rgba(0, 0, 0, 0.4);
            }

            /* تنسيق العبارة في المنتصف أسفل العداد */
            .blessing-text {
                color: #ffd700; /* لون ذهبي فخم */
                font-size: 24px;
                font-weight: bold;
                margin-top: 15px;
                margin-bottom: 20px;
                text-shadow: 0 0 8px rgba(255, 215, 0, 0.6), 0 0 5px #000;
            }

            /* شاشة طباعة أكواد الاختراق الأصلية للبلايستيشن */
            #console {
                background: rgba(22, 27, 34, 0.9);
                color: #00ffcc;
                padding: 15px;
                border-radius: 10px;
                font-family: 'Courier New', Courier, monospace;
                font-size: 14px;
                text-align: left;
                min-height: 50px;
                max-height: 120px;
                overflow-y: auto;
                border: 1px solid #30363d;
                box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            }
        </style>

        <!-- كود الكاش الذكي لضمان تشغيل التعديلة أوفلاين بدون إنترنت -->
        <script>
        if (window.applicationCache.status=='0')
        {
          window.location.replace("cache.html");
        }
        </script>
    </head>
    <body>

        <div class="main-container">
            <!-- العداد الدائري النيوني -->
            <div class="neon-timer" id="timer">5</div>
            
            <!-- العبارة الكريمة -->
            <div class="blessing-text">صل على حبيبك النبي</div>

            <!-- مكان كونسول تشغيل الثغرة الافتراضي -->
            <pre id='console'>  جاري تهكير.../pre>
        </div>

        <!-- سكريبت تشغيل العداد التنازلي التلقائي -->
        <script>
            let count = 5;
            const timerElement = document.getElementById('timer');
            const interval = setInterval(() => {
                count--;
                timerElement.innerText = count;
                if (count <= 0) {
                    clearInterval(interval);
                    timerElement.innerText = "اضغط ";
                }
            }, 1000);
        </script>

    </body>
    <!-- المحرك والمشغل الأصلي والأساسي للثغرة (مربوط تمامًا) -->
    <script type='module' src='./alert.mjs'></script>
</html>
