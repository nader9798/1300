<html manifest="psfree_lapse.cache">
<head>
<title>Mohamed Gaber PS4 11.02</title>
<link rel="shortcut icon" href="favicon.ico"></link>
<style>
/* تظبيط شكل شاشة التحميل المتناسقة مع الـ 4K والخلفية */
body {
    background-image: url("ps4.png");
    background-repeat: no-repeat;
        background-size: 100٪ 100٪; /* تم ملء الشاشة بالكامل */
    background-position: center;
    background-color: #161b22;
    color: #ffffff;
    font-size: 20px;
    text-align: center;
    margin: 0;
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}
.info {
    background: rgba(0, 0, 0, 0.7);
    padding: 20px 40px;
    border-radius: 15px;
    border: 1px solid #00d4ff;
    box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
    font-size: 25px;
    color: #00d4ff;
    text-shadow: 0 0 5px rgba(0, 212, 255, 0.5);
}
</style>
<script>
history.replaceState(null,null,'index.html');var histlength=history.length;history.go(-histlength);
function DLProgress(e){Percent=(Math.round(e.loaded / e.total * 100));msgs.innerHTML="جاري تثبيت المتصفح || أوفلاين... " + Percent + "%"};
function DisplayCacheProgress(){
setTimeout(function(){msgs.innerHTML="تم الحفظ بنجاح! جاري إعادة التشغيل...";},2000);
setTimeout(function(){location.reload();},3000);
}
window.applicationCache.addEventListener("progress",DLProgress,false);window.applicationCache.oncached=function(e){DisplayCacheProgress();};window.applicationCache.onupdateready=function(e){DisplayCacheProgress();};
</script>
</head>
<body>
<div id="msgs" class="info">جاري الاتصال...</div>
</body>
</html>
